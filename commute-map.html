// MAP INITIALIZATION
// =============================================
const map = L.map('map').setView([25.0462, 121.4330], 13);

  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 18,
}).addTo(map);

// 30-min commute radius circle (approx 7.5 km at 15 km/h bus speed)

  radius: 7500,
  color: '#e74c3c',
  fillColor: '#e74c3c',
  fillOpacity: 0.05,
  weight: 2,
  dashArray: '8,8',
}).addTo(map).bindPopup('<b>約 30 分鐘公車通勤範圍</b><br>半徑約 7.5 公里');

// Workplace marker

  className: '',
  html: '<div style="background:#e74c3c;width:24px;height:24px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 8px rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-size:14px;">W</div>',
  iconSize: [24, 24],
  iconAnchor: [12, 12],
});

L.marker([25.0462, 121.4330], { icon: workIcon, zIndexOffset: 1000 })
  .addTo(map)
  .bindPopup('<b style="font-size:16px;">工作地點</b><br>中興街口 / 湯城園區<br>近捷運先嗇宮站<br>新北市三重區')
  .openPopup();

// =============================================
// PLOTTING STOPS
// =============================================
const MIN_PER_STOP = 1.8; // average minutes between stops
const MAX_COMMUTE = 30; // minutes
const allMarkers = {};
const routeLayers = {};

// Track stops that appear on multiple routes
const stopRouteMap = {}; // stopName -> [{route, time, color}]

Object.entries(ROUTES).forEach(([routeName, routeData]) => {
  const { stops, originIdx } = routeData;
  const color = ROUTE_COLORS[routeName] || '#999';

  stops.forEach((stopName, idx) => {
    if (stopName === "中興街口") return; // skip origin itself

    const stopsAway = Math.abs(idx - originIdx);
    const estTime = Math.round(stopsAway * MIN_PER_STOP);

    if (estTime > MAX_COMMUTE) return; // beyond 30 min

    const key = stopName;
    if (!stopRouteMap[key]) stopRouteMap[key] = [];
    stopRouteMap[key].push({
      route: routeName,
      time: estTime,
      color: color,
      stopsAway: stopsAway,
    });
  });
});

// Create markers - one per unique stop, showing all routes
const routeStopCounts = {};
Object.entries(ROUTE_COLORS).forEach(([r]) => routeStopCounts[r] = 0);

Object.entries(stopRouteMap).forEach(([stopName, routes]) => {
  const coords = KNOWN_COORDS[stopName];
  if (!coords) return; // skip stops without coordinates

  const isApprox = false; // We've pre-loaded coordinates
  const minTime = Math.min(...routes.map(r => r.time));
  const primaryRoute = routes.reduce((a, b) => a.time <= b.time ? a : b);

  // Count for each route
  routes.forEach(r => {
    if (routeStopCounts[r.route] !== undefined) routeStopCounts[r.route]++;
  });

  const routeList = routes
    .sort((a, b) => a.time - b.time)
    .map(r => `<span style="color:${r.color};font-weight:bold;">${r.route}</span> (${r.stopsAway}站, ~${r.time}分)`)
    .join('<br>');

  const radius = Math.max(4, 8 - Math.floor(minTime / 5));
  const marker = L.circleMarker(coords, {
    radius: radius,
    fillColor: primaryRoute.color,
    color: '#333',
    weight: 1,
    opacity: 0.8,
    fillOpacity: 0.7,
  }).bindPopup(
    `<b style="font-size:14px;">${stopName}</b><br>` +
    `<hr style="margin:4px 0;">` +
    `${routeList}<br>` +
    `<small style="color:#666;">最短通勤: ~${minTime} 分鐘</small>`
  );

  marker.addTo(map);

  // Store marker reference for each route
  routes.forEach(r => {
    if (!routeLayers[r.route]) routeLayers[r.route] = [];
    routeLayers[r.route].push(marker);
  });
});

const legend = L.control({ position: 'topright' });
legend.onAdd = function() {
  const div = L.DomUtil.create('div', 'legend');
  div.innerHTML = '<h4>公車路線圖例</h4>';

  const routeOrder = ["111","235","257","257狗狗公車","513","616","616經黎明","622","635","636","637","638","639","663","758","783","797","799","801","806","820","835","857","藍2"];

  routeOrder.forEach(route => {
    const count = routeStopCounts[route] || 0;
    const color = ROUTE_COLORS[route];
    div.innerHTML += `<div class="legend-item">
      <div class="legend-color" style="background:${color};"></div>
      <span>${route} (${count} 站)</span>
    </div>`;
  });

  div.innerHTML += `<hr style="margin:6px 0;">
    <div class="legend-item">
      <div class="legend-color" style="background:#e74c3c;border:2px solid white;box-shadow:0 0 3px #000;"></div>

    </div>
    <div class="legend-item" style="color:#999;font-size:11px;">
      虛線圓 = 約30分鐘通勤範圍

  return div;
};
legend.addTo(map);

// INFO PANEL

const info = L.control({ position: 'topleft' });
info.onAdd = function() {
  const div = L.DomUtil.create('div', 'info-panel');
  const totalStops = Object.keys(stopRouteMap).filter(s => KNOWN_COORDS[s]).length;
  const totalRoutes = Object.keys(ROUTES).length;

  div.innerHTML = `
    <h4>30分鐘通勤地圖</h4>
    <p><b>起點:</b> 中興街口 / 湯城園區</p>
    <p><b>路線數:</b> ${totalRoutes} 條</p>
    <p><b>可達站數:</b> ${totalStops} 站</p>
    <p style="color:#666;font-size:11px;">
      通勤時間估算：每站約 1.8 分鐘<br>
      點擊站點可查看詳情
    </p>
  `;
  return div;
};
info.addTo(map);

// Fit map to show all markers
const allCoords = Object.entries(stopRouteMap)
  .filter(([name]) => KNOWN_COORDS[name])
  .map(([name]) => KNOWN_COORDS[name]);
allCoords.push([25.0462, 121.4330]); // include origin

if (allCoords.length > 1) {
  map.fitBounds(L.latLngBounds(allCoords).pad(0.05));
}

# tw-house-ops User Profile
# USER LAYER — will never be overwritten by system updates.

user:
  name: ""
  commute_origin: "龍山寺"           # 公司地點，但 WFH
  commute_max_minutes: 60            # WFH 寬鬆設定

search:
  mode: both                         # rent | buy | both
  buyer_type: first_time             # renter | first_time | upgrader

budget:
  rent_max: 30000                    # 暫定，租屋預算之後再決定
  buy_max: 12000000                  # 上限 1200 萬（區間 800–1200 萬）
  monthly_payment_max: 30000         # 每月房貸極限

finance:                             # TODO: 之後用 afford 模式時補
  monthly_income: null
  savings: null
  youth_loan_eligible: true          # 青安貸款：年齡 ≤ 40、無自有房產

current_property:                    # first_time 不適用
  estimated_value: null
  loan_remaining: null
  purchase_year: null
  selling_strategy: null

property:
  size_min: 12                       # 最小坪數
  size_max: null
  floor_min: 2                       # 避免一樓
  types:
    include: ["公寓", "華廈", "大樓", "透天", "套房"]
    exclude: ["預售屋", "店面", "辦公室", "車位"]
  age_max: 40
  elevator: optional
  parking: optional
  pet: false

regions:
  - city: "台北市"
    districts:                       # 全市 12 區，之後可縮小
      - "中正區"
      - "大同區"
      - "中山區"
      - "松山區"
      - "大安區"
      - "萬華區"
      - "信義區"
      - "士林區"
      - "北投區"
      - "內湖區"
      - "南港區"
      - "文山區"

lifestyle:
  mrt_walk_max: 15
  priorities:
    - mrt
    - supermarket
    - school
    - hospital

narrative:
  deal_breakers:
    - "頂樓加蓋"
    - "一樓"
    - "鄰近殯儀館"
  nice_to_have:
    - "南北採光"
    - "社區管理"
  notes: "WFH；公司龍山寺；首購；總價區間 800–1200 萬但月付上限 3 萬可能與總價上限有落差，待 afford 模式確認。"
